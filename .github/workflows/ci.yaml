name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "infra/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "infra/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up toolchain
        # mise.toml is the single source of truth for the Node.js and pnpm versions.
        run: |
          mise install
          mise bin-paths >> "$GITHUB_PATH"
      - name: Verify pinned pnpm versions agree
        # pnpm --version delegates to the packageManager version, so it cannot
        # detect the drift. Compare the two declarations directly instead.
        run: |
          mise_pnpm="$(mise cfg get tools.pnpm)"
          pkg_pnpm="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          if [ "$mise_pnpm" != "$pkg_pnpm" ]; then
            echo "pnpm version drift: mise.toml=$mise_pnpm packageManager=$pkg_pnpm" >&2
            exit 1
          fi
          echo "pnpm $mise_pnpm"
      - name: Resolve pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check lint and format
        run: pnpm exec biome ci
      - name: Check types
        run: pnpm typecheck
      - name: Build
        run: pnpm build
